services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: teamcollab-postgres
    environment:
      POSTGRES_DB: teamcollab
      POSTGRES_USER: teamcollab
      POSTGRES_PASSWORD: teamcollab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: teamcollab-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: