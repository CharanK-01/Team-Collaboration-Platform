spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/teamcollab
spring.datasource.username=teamcollab
spring.datasource.password=teamcollab

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-before-production-0123456789}
app.jwt.expiration-minutes=60